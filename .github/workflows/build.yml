name: Build IPA
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p Assets.xcassets/AppIcon.appiconset
          cp icon.png Assets.xcassets/AppIcon.appiconset/icon.png
          echo '{"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > Assets.xcassets/AppIcon.appiconset/Contents.json
          echo '{"info":{"author":"xcode","version":1}}' > Assets.xcassets/Contents.json
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild -project SrepPortal.xcodeproj -scheme SrepPortal -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/SrepPortal.app Payload/
          zip -r SrepPortal.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SrepPortal-ipa
          path: SrepPortal.ipa
